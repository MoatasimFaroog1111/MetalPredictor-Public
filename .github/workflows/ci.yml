name: Public Live Platform CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
          python -m pip install .
      - name: Compile
        run: python -m compileall -q src run_live.py
      - name: Tests
        run: python -m pytest tests/test_live_platform.py
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t metalpredictor-public-ci:latest .
