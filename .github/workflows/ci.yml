name: Public Live Platform CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
          python -m pip install .
      - name: Compile
        run: python -m compileall -q src run_live.py docker_entrypoint_live.py
      - name: Tests
        run: python -m pytest tests/test_live_platform.py tests/test_gold_api_live_source.py tests/test_bullionvault_quote_provider.py tests/test_microstructure_research.py
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t metalpredictor-public-ci:latest .
      - name: Validate persistent-volume permissions and microstructure SQLite
        run: |
          set -euo pipefail
          docker volume create metalpredictor-public-ci-data >/dev/null
          cleanup() {
            docker volume rm metalpredictor-public-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm \
            -v metalpredictor-public-ci-data:/data \
            metalpredictor-public-ci:latest \
            python -c "import os; from pathlib import Path; from metal_predictor.microstructure.repository import SQLiteMicrostructureRepository; assert os.geteuid() == 10001, os.geteuid(); p=Path('/data/ci-write-probe'); p.write_text('ok'); assert p.read_text() == 'ok'; p.unlink(); r=SQLiteMicrostructureRepository('/data/microstructure-ci.sqlite3'); assert r.count() == 0"
